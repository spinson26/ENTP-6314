<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Vacation Scheduler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <header class="app-header">
    <h1>Team Vacation Scheduler</h1>
    <p class="subtitle">Phase 1 — calendar check. The full scheduling app is being built in stages.</p>
  </header>

  <section class="panel">
    <h2>Rules in effect</h2>
    <div id="rules-summary"></div>
  </section>

  <section class="panel">
    <h2>Self-checks</h2>
    <div id="calendar-check"></div>
  </section>

  <section class="panel">
    <h2>The 52 weeks</h2>
    <p class="hint">
      <span class="swatch swatch-summer"></span> summer week
      <span class="swatch swatch-lottery"></span> lottery week (not bid on by seniority)
    </p>
    <table class="week-table" id="week-table"></table>
  </section>
</div>

<script src="rules.js"></script>
<script src="employees.js"></script>
<script src="calendar.js"></script>
<script src="validate.js"></script>
<script src="selfcheck.js"></script>
<script src="preview.js"></script>
</body>
</html>
